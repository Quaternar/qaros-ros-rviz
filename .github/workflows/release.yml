# SPDX-License-Identifier: MIT
#
# Builds the qar_rviz_streaming RViz2 plugin for each {ROS 2 distribution x platform}, packages
# each build as an overlay prefix zip (scripts/package-release.*) and attaches the zips and one
# manifest.json to the GitHub release of the tag. Tags follow the QAROS release version: tag
# v0.9.0 is the plugin release for QAROS 0.9.0. See docs/CONFIGURATION.md, section
# "Release assets and manifest.json".
#
# The upstream libraries qar_ogre_adapter (qaros-ogre) and qar_qt_streaming (qaros-qt) are built
# into the plugin from source checkouts at the pinned commits below (source mode of
# cmake/QarRosBuildSupport.cmake); the QarOS headers come from the submodule external/qaros.
name: Release

on:
  push:
    tags: ['v*']
  # A pull request into main builds and packages every target as workflow artifacts (version
  # 0.0.0-pr.<number>) and never publishes a release.
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: Release version, the QAROS version without the leading v (for example 0.9.0)
        required: true
        type: string
      publish:
        description: Create or update the GitHub release v<version> (otherwise workflow artifacts only)
        type: boolean
        default: false
      qaros_ogre_ref:
        description: Commit of Quaternar/qaros-ogre (empty for the pinned default)
        type: string
        default: ''
      qaros_qt_ref:
        description: Commit of Quaternar/qaros-qt (empty for the pinned default)
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  QAROS_OGRE_REF: ${{ inputs.qaros_ogre_ref || 'ade6899a20003574197a09340595d316a8a4105c' }}
  QAROS_QT_REF: ${{ inputs.qaros_qt_ref || '746097c4d0529dc5a2b221b53ad8c9667766fc2f' }}
  # The build needs no Git LFS file of the qaros submodule (images of its documentation).
  GIT_LFS_SKIP_SMUDGE: '1'

jobs:
  version:
    name: Release version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        env:
          EVENT: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then v="$INPUT_VERSION";
          elif [ "$EVENT" = pull_request ]; then v="0.0.0-pr.$PR_NUMBER";
          else v="$REF_NAME"; fi
          v="${v#v}"
          if ! [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.+-]+)?$ ]]; then
            echo "::error::'$v' is not a release version like 0.9.0 (tags are v<QAROS version>)"
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Release version: $v"

  script-tests:
    name: Script tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4
      - name: register-qaros-plugin.ps1 (PowerShell 7)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test_register_qaros_plugin.ps1
      - name: register-qaros-plugin.ps1 (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\test_register_qaros_plugin.ps1
      - name: register-qaros-plugin.sh
        if: runner.os == 'Linux'
        run: bash scripts/test_register_qaros_plugin.sh

  windows:
    name: Build ${{ matrix.distro }} ${{ matrix.platform }}
    needs: [version, script-tests]
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          # ROS 2 Humble Windows binary release (scripts/fetch_dependencies.ps1), Qt 5.15.2
          # msvc2019_64, the distribution repairs of docs/INSTALL.md; MSVC v143 of Visual Studio
          # 2022, which links against the v142 binaries of the distribution.
          - distro: humble
            platform: windows-x64
    env:
      QAR_VS_VERSION: '2022'
      QAR_DEPS_ROOT: C:\qar\deps
      ROS2_INSTALL_ROOT: C:\qar\deps\ros2_humble\ros2-windows
      QAR_QT_ROOT: C:\qar\deps\Qt\5.15.2\msvc2019_64
      QAR_VENV: C:\qar\venv
      QAR_PREFIX: C:\qar\install
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/checkout@v4
        with:
          repository: Quaternar/qaros-ogre
          ref: ${{ env.QAROS_OGRE_REF }}
          path: upstream/qaros-ogre
      - uses: actions/checkout@v4
        with:
          repository: Quaternar/qaros-qt
          ref: ${{ env.QAROS_QT_REF }}
          path: upstream/qaros-qt

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Python environment
        run: |
          python -m venv $env:QAR_VENV
          & "$env:QAR_VENV\Scripts\python.exe" -m pip install --upgrade pip
          & "$env:QAR_VENV\Scripts\python.exe" -m pip install -r requirements.txt -r requirements-ros.txt ninja

      - name: Cache the ROS 2 distribution and Qt
        uses: actions/cache@v4
        with:
          path: C:\qar\deps
          key: deps-${{ matrix.distro }}-${{ matrix.platform }}-qt5.15.2-${{ hashFiles('scripts/fetch_dependencies.ps1', 'scripts/fix_*.ps1', 'scripts/qar_locations.ps1') }}

      - name: ROS 2 distribution
        run: ./scripts/fetch_dependencies.ps1

      - name: Qt 5.15.2 msvc2019_64
        run: |
          if (-not (Test-Path "$env:QAR_QT_ROOT\lib\cmake\Qt5\Qt5Config.cmake")) {
            & "$env:QAR_VENV\Scripts\python.exe" -m aqt install-qt windows desktop 5.15.2 win64_msvc2019_64 --outputdir "$env:QAR_DEPS_ROOT\Qt"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      # The repairs that the build needs (docs/INSTALL.md, "Repairs to the ROS 2 Windows
      # distribution"); the run-time repairs are not needed to build. All are idempotent.
      - name: Distribution repairs for the build
        run: |
          ./scripts/fix_missing_spdlog_dll.ps1
          ./scripts/fix_missing_vendor_dlls.ps1
          ./scripts/fix_missing_vendor_cmake_configs.ps1
          ./scripts/fix_missing_eigen.ps1
          ./scripts/fix_stale_pixi_paths.ps1 -PythonLib "$env:pythonLocation\libs\python310.lib"

      - name: Build the plugin
        run: |
          $ws = $env:GITHUB_WORKSPACE -replace '\\', '/'
          ./scripts/build_plugin.ps1 -CMakeArgs "-DQAR_OGRE_ADAPTER_SOURCE_DIR=$ws/upstream/qaros-ogre", "-DQAR_QT_STREAMING_SOURCE_DIR=$ws/upstream/qaros-qt"

      - name: Package
        run: ./scripts/package-release.ps1 -Version '${{ needs.version.outputs.version }}' -Distro '${{ matrix.distro }}' -Platform '${{ matrix.platform }}' -OutDir dist

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.distro }}-${{ matrix.platform }}
          path: |
            dist/*.zip
            dist/qar_rviz_streaming-*.json
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: logs-${{ matrix.distro }}-${{ matrix.platform }}
          path: build/colcon/log
          if-no-files-found: ignore

  linux:
    name: Build ${{ matrix.distro }} linux-x64
    needs: [version, script-tests]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: humble
            os: ubuntu-22.04
          - distro: jazzy
            os: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/checkout@v4
        with:
          repository: Quaternar/qaros-ogre
          ref: ${{ env.QAROS_OGRE_REF }}
          path: upstream/qaros-ogre
      - uses: actions/checkout@v4
        with:
          repository: Quaternar/qaros-qt
          ref: ${{ env.QAROS_QT_REF }}
          path: upstream/qaros-qt

      - uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: ${{ matrix.distro }}

      - name: Build dependencies
        env:
          DISTRO: ${{ matrix.distro }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            "ros-$DISTRO-rviz2" "ros-$DISTRO-rviz-common" "ros-$DISTRO-rviz-rendering" \
            "ros-$DISTRO-rviz-default-plugins" "ros-$DISTRO-rviz-ogre-vendor" "ros-$DISTRO-pluginlib" \
            "ros-$DISTRO-rclcpp" "ros-$DISTRO-sensor-msgs" "ros-$DISTRO-ament-index-cpp" \
            "ros-$DISTRO-ament-cmake" qtbase5-dev libqt5websockets5-dev ninja-build \
            python3-colcon-common-extensions

      - name: Build the plugin
        run: |
          bash scripts/build_plugin.sh --ros-root "/opt/ros/${{ matrix.distro }}" \
            --prefix "$RUNNER_TEMP/install" \
            --ogre-source upstream/qaros-ogre --qt-source upstream/qaros-qt

      - name: Package
        run: |
          bash scripts/package-release.sh --prefix "$RUNNER_TEMP/install" \
            --version '${{ needs.version.outputs.version }}' --distro '${{ matrix.distro }}' \
            --platform linux-x64 --out-dir dist

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.distro }}-linux-x64
          path: |
            dist/*.zip
            dist/qar_rviz_streaming-*.json
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: logs-${{ matrix.distro }}-linux-x64
          path: build/colcon/log
          if-no-files-found: ignore

  release:
    name: GitHub release
    needs: [version, windows, linux]
    # Publishes what was built: a failed matrix job leaves its asset out of the release and of
    # manifest.json (QAROS then reports no prebuilt plugin for that distribution), and stays red.
    if: ${{ !cancelled() && needs.version.result == 'success' && (github.event_name == 'push' || inputs.publish) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: manifest.json
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          shopt -s nullglob
          entries=(dist/qar_rviz_streaming-"$VERSION"-*.json)
          zips=(dist/*.zip)
          if [ ${#zips[@]} -eq 0 ]; then echo "::error::no asset was built"; exit 1; fi
          for e in "${entries[@]}"; do
            name="$(jq -r .name "$e")"; sum="$(jq -r .sha256 "$e")"
            echo "$sum  dist/$name" | sha256sum -c -
          done
          jq -s --arg v "$VERSION" '{version: 1, release: $v, package: "qar_rviz_streaming", assets: (sort_by(.name))}' \
            "${entries[@]}" > dist/manifest.json
          cat dist/manifest.json

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          tag="v$VERSION"
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "qar_rviz_streaming for QAROS $VERSION" \
              --notes "Prebuilt qar_rviz_streaming RViz2 plugin for QAROS $VERSION. Each zip is an overlay prefix for one ROS 2 distribution and platform; manifest.json lists their SHA-256 and the QarOS C API header hash."
          fi
          gh release upload "$tag" dist/*.zip dist/manifest.json --repo "$GITHUB_REPOSITORY" --clobber
